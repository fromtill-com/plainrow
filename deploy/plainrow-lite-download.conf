# Include from the fromtill.com nginx server so Download Lite is a file.
# Same bytes as /plainrow/app.html and /plainrow/plainrow-lite.html.
# File-only publish already works: live nginx serves .bin as application/octet-stream.
# This header names the saved file and marks the response as an attachment.

location = /plainrow/plainrow-lite.bin {
    default_type application/octet-stream;
    add_header Content-Disposition 'attachment; filename="plainrow-lite.html"' always;
    add_header X-Content-Type-Options nosniff always;
}
